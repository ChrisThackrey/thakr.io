                - generic [ref=e807]:
                  - paragraph [ref=e808]: Starcloud's founder told me they could become the most valuable company in the world. Astroforge's founder said the same thing. - Data centers in space. - Every GPU could be orbiting Earth. - If Starcloud owns that market, they own the infrastructure layer for AI. Elsewhere, I was pitched asteroid mining - (football field size made of platinum). These founders aren't joking. They believe it. YC trains them to think this big. You don't build SpaceX by aiming for a nice exit. You build it by trying to make humanity interplanetary. The ambition is the point! Most people hear these claims and think the founders are delusional…. And they might be but the only ones who succeed are the ones crazy enough to try. Elon Musk tried to buy rockets from Russia. They laughed at him. So he built SpaceX. Now SpaceX is worth over $200B and reusable rockets are normal. At Lobster Capital, we hear these pitches all the time. Some will fail spectacularly. But one or two might actually pull it off. And when they do, they'll own industries worth trillions. Can the technology and timing align to make it possible…? Space is opening up. Launch costs dropped 90%. Foundation models make automation feasible. The pieces are coming together. Maybe these founders really will own the world. Or at least a very valuable piece of it.
