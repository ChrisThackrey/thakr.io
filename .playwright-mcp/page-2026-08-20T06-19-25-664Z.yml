                            - generic [ref=e259]:
                              - text: "60 hours a week. That is what building the fundraising list, reading every fund, and drafting every intro used to cost you. Every week of the raise. Not counting the follow-ups you forgot. I just rebuilt all of it as one Claude agent. Seven skills, one setup, running the whole machinery of the raise. You still send every message. The agent does everything before the send button. Here is the collapse: Old raise: 1 analyst (list), 1 associate (research), 1 SDR (outreach), 1 chief of staff (follow-ups and updates), and you (deck, pitch, decisions). New raise: 1 Claude agent (skills 1 to 7), and you (calls, sends, decisions). The seven skills, in the order you build them: 1. ICP → your stage, sector, and traction turned into a precise investor profile, plus the 3 reasons a fund would pass 2. LIST → 50 funds and angels writing your cheque size, ranked by fit, off a investor database, top 10 flagged for the week 3. RESEARCH → every fund read before you write. Thesis, last 12 months of investments, portfolio adjacencies, the angle that will make them lean in, the objection they will raise 4. OUTREACH → 4-line intros that reference the exact bet a partner just made. Three variations per fund, warm to direct. You pick the one that sounds like you 5. FOLLOW-UP → scans your inbox for warm replies you have not answered. Drafts the next message with the thread context loaded. Sorted by warmth 6. DECK → stress-tests your deck like a Monday partner meeting. Five hardest questions, the slide where the story drops, the metric they will not believe, the single change that most improves your odds 7. UPDATE → drafts the monthly investor update from your numbers. TL;DR, wins, lowlights, specific asks. Turns a one-time raise into compounding momentum The rule that never breaks: The agent drafts. You send. Every intro reviewed before it goes. Every follow-up gated on your yes. Every send is still your relationship, your voice, your judgment. What actually changes: → The week you used to spend building a pipeline becomes a sentence → Every intro grounded in a specific bet the partner just made → Every warm reply followed up before it goes cold → Every deck reviewed like a Monday partner meeting before you walk in The full walkthrough just went live. Every skill, every prompt, every build step. Comment \"AGENT\" and I will send it to you. 1️⃣ Like this post 2️⃣ Comment \"AGENT\" 3️⃣ Connect so I can send it P.S. Save this for your next raise 🔖"
